version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: brunch_bouake_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: brunch_bouake_pms
      MYSQL_USER: pms_user
      MYSQL_PASSWORD: pms_password
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  db_data:
